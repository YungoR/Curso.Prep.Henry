name: Build IURIX Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [ iurix-monitor ]
    paths:
      - 'IURIX_Monitor_SL/**'
      - '.github/workflows/iurix-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IURIX_Monitor_SL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IURIX-Monitor-SL-v0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IURIX-Monitor-SL-v0.3
          path: IURIX_Monitor_SL/IURIX-Monitor-SL-v0.3.apk
          retention-days: 7
